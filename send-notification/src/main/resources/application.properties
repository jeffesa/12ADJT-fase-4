# ==========================================
# send-notification — Application Configuration (Properties)
# ==========================================

# Application info
quarkus.application.name=send-notification
quarkus.application.version=1.0.0

# Lambda handler (CDI bean name)
quarkus.lambda.handler=sendNotification

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.fiap".level=DEBUG

# SES
quarkus.ses.aws.region=${AWS_REGION:us-east-1}

# Dev Services (LocalStack container) are not used: the project talks to AWS directly.
quarkus.devservices.enabled=false

# Local development (mvn quarkus:dev): SES in the project region.
%dev.quarkus.ses.aws.region=sa-east-1

# Quarkus Configuration - Disable validation of unknown config sources
quarkus.config.mapping.validate-unknown=false

# Notification Infrastructure Configuration
notification.sender-email=${SENDER_EMAIL:noreply@feedback-fase-4.com}
notification.recipient-email=${ADMIN_EMAIL:admin@feedback-fase-4.com}
notification.subject-template=⚠ Feedback $${urgency}: $${description}
