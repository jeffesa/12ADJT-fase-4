# ==========================================
# send-notification — Lambda configuration
# ==========================================

quarkus.profile=dev

# -------------------
# SES
# -------------------
%dev.quarkus.ses.endpoint-override=http://localhost:4566
%dev.quarkus.ses.aws.region=us-east-1
%dev.quarkus.ses.aws.credentials.type=static
%dev.quarkus.ses.aws.credentials.static-provider.access-key-id=test
%dev.quarkus.ses.aws.credentials.static-provider.secret-access-key=test

%prod.quarkus.ses.aws.region=${AWS_REGION:us-east-1}

# ==========================================
# Notification — Email sender configuration
# ==========================================
notification.sender-email=${SENDER_EMAIL:noreply@feedback-fase-4.com}
notification.admin-email=${ADMIN_EMAIL:admin@feedback-fase-4.com}
notification.subject-template=⚠️ Feedback ${urgency}: ${description}
notification.ses-region=${SES_REGION:us-east-1}

# -------------------
# Logging
# -------------------
quarkus.log.level=INFO
quarkus.log.category."com.fiap".level=DEBUG
