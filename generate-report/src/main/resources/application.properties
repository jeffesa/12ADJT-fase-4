# ==========================================
# generate-report — Application Configuration (Properties)
# ==========================================

# Application info
quarkus.application.name=generate-report
quarkus.application.version=1.0.0

# Lambda handler (CDI bean name)
quarkus.lambda.handler=generateReport

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.fiap".level=DEBUG

# DynamoDB
quarkus.dynamodb.aws.region=${AWS_REGION:us-east-1}

# SES
quarkus.ses.aws.region=${AWS_REGION:us-east-1}

# Quarkus Configuration - Disable validation of unknown config sources
quarkus.config.mapping.validate-unknown=false

# Report Infrastructure Configuration
report.admin-email=${ADMIN_EMAIL:admin@feedback-fase-4.com}
report.sender-email=${SENDER_EMAIL:noreply@feedback-fase-4.com}
report.table-name=${TABLE_NAME:prod-feedback-table}
report.report-title=Weekly Feedback Report
