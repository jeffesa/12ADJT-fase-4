# ==========================================
# generate-report — configurações da Lambda
# ==========================================

quarkus.profile=dev

# -------------------
# DynamoDB
# -------------------
%dev.quarkus.dynamodb.endpoint-override=http://localhost:4566
%dev.quarkus.dynamodb.aws.region=us-east-1
%dev.quarkus.dynamodb.aws.credentials.type=static
%dev.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=test
%dev.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=test

%prod.quarkus.dynamodb.aws.region=${AWS_REGION:us-east-1}

# Nome da tabela DynamoDB
dynamodb.table.feedbacks=feedbacks

# -------------------
# SES
# -------------------
%dev.quarkus.ses.endpoint-override=http://localhost:4566
%dev.quarkus.ses.aws.region=us-east-1
%dev.quarkus.ses.aws.credentials.type=static
%dev.quarkus.ses.aws.credentials.static-provider.access-key-id=test
%dev.quarkus.ses.aws.credentials.static-provider.secret-access-key=test

%prod.quarkus.ses.aws.region=${AWS_REGION:us-east-1}

# E-mail do administrador (injetado pelo SAM via env var)
report.admin.email=${ADMIN_EMAIL:admin@example.com}

# -------------------
# Report Configuration
# -------------------
report.sender.email=${SENDER_EMAIL:noreply@feedback-platform.com}
report.timezone=${REPORT_TIMEZONE:UTC}

# -------------------
# Logging
# -------------------
quarkus.log.level=INFO
quarkus.log.category."com.fiap".level=DEBUG
