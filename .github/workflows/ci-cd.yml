name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  # PRs to develop (feature/fix → develop) and to main (release develop → main).
  # PRs to main require SonarCloud with a blocking quality gate.
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  # Job name used as the required status check on the main branch protection:
  # "Build & Test & SonarCloud"
  build:
    name: Build & Test & SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarCloud history

      # SonarCloud token policy:
      # - PR to main: SONAR_TOKEN required, fails if missing (the PR gate is the quality control).
      # - push to main: does not run Sonar (SonarCloud does not analyze main as a branch; the analysis
      #   comes from develop, same commit, already approved by the quality gate before the PR).
      # - develop and PRs to develop: SONAR_TOKEN required for the gate to run.
      - name: Check SonarCloud token policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          SONAR_TOKEN_VALUE: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN_VALUE" ]; then
            echo "SONAR_TOKEN configurado."
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE_REF" = "main" ]; then
            echo "::error title=SONAR_TOKEN ausente::SONAR_TOKEN não está configurado. PR para main exige análise SonarCloud e quality gate."
            exit 1
          fi
          echo "::notice::SONAR_TOKEN não configurado. Análise SonarCloud ignorada neste evento."

      # Installs Java 21 (SonarCloud scanner) and Java 17 (project build)
      # The last listed version becomes the default JAVA_HOME (Java 17 for the build)
      - name: Set up JDKs (21 for Sonar, 17 for build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            21
            17
          cache: maven

      # SonarCloud scanner cache
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Build + tests + JaCoCo coverage (Java 17)
      - name: Build and Test with Coverage
        run: mvn -B clean verify

      # Upload coverage reports (optional, for viewing)
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./*/target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella
          verbose: true
        if: always()

      # SonarCloud analysis (Java 21 required for scanner v4.x+)
      # -Dsonar.qualitygate.wait=true makes Maven fail if the quality gate fails.
      # Does not run on push to main: SonarCloud does not analyze main as a branch on the current plan.
      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: mvn -B sonar:sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.qualitygate.wait=true

      # Completion log
      - name: Build Status
        if: success()
        run: echo "✅ Build, tests, and SonarCloud analysis completed successfully"

  # Automatic deploy only after a merge to main (push), after build/Sonar pass.
  deploy:
    name: Deploy to prod (SAM)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: prod
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      API_TOKEN: ${{ secrets.API_TOKEN }}

    steps:
      # Fail early with a clear message if the required secrets do not exist
      - name: Check required deploy secrets
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then
            echo "::error title=Secret ausente::AWS_DEPLOY_ROLE_ARN não está configurado no environment prod."
            exit 1
          fi
          if [ -z "$ADMIN_EMAIL" ]; then
            echo "::error title=Secret ausente::ADMIN_EMAIL não está configurado no environment prod."
            exit 1
          fi
          if [ -z "$SENDER_EMAIL" ]; then
            echo "::error title=Secret ausente::SENDER_EMAIL não está configurado no environment prod."
            exit 1
          fi
          if [ -z "$API_TOKEN" ]; then
            echo "::error title=Secret ausente::API_TOKEN não está configurado no environment prod."
            exit 1
          fi
          echo "Secrets de deploy configurados."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: sa-east-1

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      # Builds the function.zip files referenced by the template (CodeUri)
      - name: Package Lambda artifacts
        run: mvn -B package -DskipTests

      - name: SAM build
        working-directory: infra
        run: sam build

      - name: SAM deploy (prod)
        working-directory: infra
        run: >-
          sam deploy --config-env prod --no-confirm-changeset
          --parameter-overrides "Environment=prod AdminEmail=$ADMIN_EMAIL SenderEmail=$SENDER_EMAIL ApiToken=$API_TOKEN Region=sa-east-1"
