# SonarCloud - Tech Challenge Fase 4 (Projeto Serverless Multi-Module)
sonar.organization=jeffesa
sonar.projectKey=jeffesa_12ADJT-fase-4
sonar.projectName=Tech Challenge Fase 4 - Plataforma de Feedback Serverless

# Módulos Maven (3 Lambdas independentes)
sonar.modules=receive-feedback,send-notification,generate-report

# Fontes e testes (por módulo, herdado pelos submódulos)
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Relatórios de cobertura JaCoCo (XML por módulo)
# O SonarCloud busca em cada módulo: {module}/target/site/jacoco/jacoco.xml
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusões de cobertura: classes sem lógica testável
sonar.coverage.exclusions=\
  **/config/**,\
  **/dto/**,\
  **/infra/handler/**,\
  **/*Handler.java,\
  **/*Application.java

# Exclusões de duplicação de código: DTOs e configurações
sonar.cpd.exclusions=**/dto/**,**/config/**

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate (opcional, configurado em SonarCloud)
# sonar.qualitygate.wait=true
