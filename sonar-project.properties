# SonarCloud - Tech Challenge Fase 4 (Serverless Multi-Module Project)
sonar.organization=jeffesa
sonar.projectKey=jeffesa_12ADJT-fase-4
sonar.projectName=Tech Challenge Fase 4 - Plataforma de Feedback Serverless

# Maven modules (3 independent Lambdas)
sonar.modules=receive-feedback,send-notification,generate-report

# Sources and tests (per module, inherited by the submodules)
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# JaCoCo coverage reports (XML per module)
# SonarCloud looks in each module: {module}/target/site/jacoco/jacoco.xml
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Coverage exclusions: classes without testable logic or pure utilities
sonar.coverage.exclusions=\
  **/config/**,\
  **/dto/**,\
  **/handler/**,\
  **/persistence/**,\
  **/messaging/**,\
  **/*Mapper.java,\
  **/*Builder.java,\
  **/*Application.java

# Duplication exclusions: DTOs and configuration classes
sonar.cpd.exclusions=**/dto/**,**/config/**

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate (optional, configured in SonarCloud)
# sonar.qualitygate.wait=true
