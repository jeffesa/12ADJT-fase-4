version = 0.1

#========================================
# DEV ENVIRONMENT PROFILE
#========================================
[dev]
[dev.deploy.parameters]
stack_name = "feedback-api-dev"
s3_bucket = "sam-artifacts-sa-east-1-dev"
region = "sa-east-1"
capabilities = ["CAPABILITY_AUTO_EXPAND", "CAPABILITY_IAM", "CAPABILITY_NAMED_IAM"]
confirm_changeset = false
parameter_overrides = "Environment=dev AdminEmail=dev-admin@example.com Region=sa-east-1"

#========================================
# PROD ENVIRONMENT PROFILE
#========================================
[prod]
[prod.deploy.parameters]
stack_name = "feedback-api-prod"
s3_bucket = "sam-artifacts-sa-east-1-prod"
region = "sa-east-1"
capabilities = ["CAPABILITY_AUTO_EXPAND", "CAPABILITY_IAM", "CAPABILITY_NAMED_IAM"]
confirm_changeset = false
parameter_overrides = "Environment=prod AdminEmail=admin@production.example.com Region=sa-east-1"

