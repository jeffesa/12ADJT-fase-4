# ==========================================
# receive-feedback — configurações da Lambda
# ==========================================

# Profile ativo (dev usa LocalStack, prod usa AWS real)
quarkus.profile=dev

# -------------------
# DynamoDB
# -------------------
# dev: aponta para LocalStack
%dev.quarkus.dynamodb.endpoint-override=http://localhost:4566
%dev.quarkus.dynamodb.aws.region=us-east-1
%dev.quarkus.dynamodb.aws.credentials.type=static
%dev.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=test
%dev.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=test

# prod: usa credenciais da IAM Role da Lambda (sem configuração explícita)
%prod.quarkus.dynamodb.aws.region=${AWS_REGION:us-east-1}

# Nome da tabela DynamoDB
dynamodb.table.feedbacks=feedbacks

# -------------------
# SNS
# -------------------
%dev.quarkus.sns.endpoint-override=http://localhost:4566
%dev.quarkus.sns.aws.region=us-east-1
%dev.quarkus.sns.aws.credentials.type=static
%dev.quarkus.sns.aws.credentials.static-provider.access-key-id=test
%dev.quarkus.sns.aws.credentials.static-provider.secret-access-key=test

%prod.quarkus.sns.aws.region=${AWS_REGION:us-east-1}

# ARN do tópico SNS para notificações urgentes (injetado pelo SAM via env var)
feedback.topic.arn=${FEEDBACK_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:feedback-urgent-topic}

# -------------------
# Logging
# -------------------
quarkus.log.level=INFO
quarkus.log.category."com.fiap".level=DEBUG
