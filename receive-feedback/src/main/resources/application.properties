# ==========================================
# receive-feedback — Application Configuration (Properties)
# ==========================================

# Application info
quarkus.application.name=receive-feedback
quarkus.application.version=1.0.0

# Lambda handler (CDI bean name)
quarkus.lambda.handler=receiveFeedback

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.fiap".level=DEBUG

# CloudWatch Logs
quarkus.cloudwatch.enabled=true

# DynamoDB
quarkus.dynamodb.aws.region=${AWS_REGION:us-east-1}

# SNS
quarkus.sns.aws.region=${AWS_REGION:us-east-1}

# Feedback Configuration Defaults (required by FeedbackConfiguration @ConfigMapping)
feedback.urgency.high.min=0
feedback.urgency.high.max=5
feedback.urgency.medium.min=6
feedback.urgency.medium.max=7
feedback.urgency.low.min=8
feedback.urgency.low.max=10
feedback.validation.rating_min=0
feedback.validation.rating_max=10
feedback.validation.description_min_length=5
feedback.validation.description_max_length=1000

# Quarkus Configuration - Disable validation of unknown config sources
quarkus.config.mapping.validate-unknown=false

# Disable Dev Services (we're using AWS directly, not LocalStack)
quarkus.devservices.enabled=false
quarkus.devservices.localstack.enabled=false

# Infrastructure Configuration
dynamodb.table.feedbacks=${TABLE_NAME:prod-feedback-table}
sns.topic.arn=${FEEDBACK_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:feedback-urgent-topic}
